name: quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kicks_disposable_test
          POSTGRES_USER: kicks_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kicks_test -d kicks_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Keep both names during the KICKS_DISPOSABLE_DATABASE_URL ->
      # KICKS_TEST_DATABASE_URL transition so either test revision runs.
      KICKS_DISPOSABLE_DATABASE_URL: 'postgresql://kicks_test@127.0.0.1:5433/kicks_disposable_test'
      KICKS_TEST_DATABASE_URL: 'postgresql://kicks_test@127.0.0.1:5433/kicks_disposable_test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Require disposable PostgreSQL test configuration
        run: |
          test -n "$KICKS_DISPOSABLE_DATABASE_URL"
          test -n "$KICKS_TEST_DATABASE_URL"
      - run: npm test
  collector-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Compile and run Android collector core JVM tests
        run: |
          set -euo pipefail
          KOTLIN=2.1.21
          curl -fsSL -o /tmp/kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN}/kotlin-compiler-${KOTLIN}.zip"
          unzip -q /tmp/kotlin.zip -d /tmp
          for j in junit/junit/4.13.2/junit-4.13.2.jar org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar; do curl -fsSLO --output-dir /tmp "https://repo1.maven.org/maven2/$j"; done
          CP=/tmp/junit-4.13.2.jar:/tmp/hamcrest-core-1.3.jar:/tmp/kotlinc/lib/kotlin-stdlib.jar
          SRC=apps/android/android/app/src
          /tmp/kotlinc/bin/kotlinc -cp "$CP" $SRC/main/java/com/datastorm/kicks/vpn/core/*.kt $SRC/test/java/com/datastorm/kicks/vpn/core/*.kt -d /tmp/out
          CLASSES=$(cd /tmp/out && find . -name '*Test.class' | sed 's#^\./##; s#\.class$##; s#/#.#g')
          java -cp "/tmp/out:$CP" org.junit.runner.JUnitCore $CLASSES
